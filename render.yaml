services:
  - type: web
    name: poulton-hq
    runtime: node
    plan: starter            # needed for the persistent disk below (free plans lose data on restart)
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DASH_USER
        value: cliff
      - key: DASH_PASS
        sync: false          # Render asks you to type it in; never commit it
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        value: https://poulton-hq.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false          # from Google Cloud > Credentials (OAuth client)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: hq-data
      mountPath: /var/data
      sizeGB: 1
